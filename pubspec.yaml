
name: FlexiWeigh
description: "FlexiWeight - Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Database
  drift: ^2.28.0
  drift_flutter: ^0.2.4

  # Utilities
  uuid: ^4.5.1
  intl: any
  shared_preferences: ^2.3.0

  # Navigation
  go_router: ^14.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code generation
  drift_dev: ^2.28.0
  build_runner: ^2.4.13

  # Development tools
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/logo.png"

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar-Regular.ttf
        - asset: assets/fonts/NotoSansMyanmar-SemiBold.ttf
          weight: 700

flutter_intl:
  enabled: true
